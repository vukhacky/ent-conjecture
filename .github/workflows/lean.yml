name: Verify the Lean formalization
on:
  push:
    branches: [main]
    paths:
      - 'lean/**'
      - '.github/workflows/lean.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Generate and verify the integer certificate sources
        working-directory: lean
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install python-flint==0.9.0
          .venv/bin/python scripts/generate_certificates.py
      - uses: leanprover/lean-action@ba3fdfe5c4476c925da13bf11a005ddb47e47aee # v1
        with:
          lake-package-directory: lean
          auto-config: false
          build: false
          lint: false
          test: false
          use-github-cache: false
          use-mathlib-cache: false
      - name: Fetch pinned dependencies and verify every Lean module from source
        working-directory: lean
        run: python3 scripts/verify_lean.py --fetch-cache --jobs 2
